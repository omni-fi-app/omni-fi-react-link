version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        # Majors ARE proposed for Actions, and there is deliberately no `ignore`
        # block on this ecosystem. A major here is the ordinary release cadence
        # — a bumped Node runtime, a renamed input — and every action is pinned
        # by SHA, so a bad bump is one revert. Bun below keeps the major-ignore,
        # where a major genuinely can change runtime behaviour.
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      all-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
