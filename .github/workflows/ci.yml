name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    # Bounded rather than inheriting GitHub's 360-minute default. Lower stakes
    # here than in omni-fi-web, which gained a browser suite — this job is lint +
    # build + test, all fail-fast — but `CI` is the required status check, so a
    # hung job holds the merge as well as the runner. `cancel-in-progress` covers
    # a branch that gets pushed again; nothing covers a PR left open.
    # Guarded by src/ci-workflow.test.ts.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # From package.json's `packageManager`, which this repo already declares —
      # a literal here would be a second source of truth, and the sticky one.
      # Bun does not enforce the pin itself (measured: it ignores both
      # `packageManager` and `.bun-version`), so this binds CI and
      # src/ci-workflow.test.ts binds local development.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
